name: voiceagent
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - numpy=1.24
  - scipy
  - conda-forge::libsndfile       # required by soundfile on Linux/Mac

  # PyTorch — CPU build (swap for pytorch-cuda=12.1 if you have a GPU)
  - pytorch::pytorch=2.2
  - pytorch::torchaudio=2.2
  - pytorch::cpuonly

  - pip:
    # Hugging Face stack
    - transformers>=4.38.0
    - datasets>=2.18.0
    - huggingface-hub>=0.21.0
    - accelerate>=0.27.0

    # TTS / Audio
    - soundfile>=0.12.1
    - librosa>=0.10.1
    - speechbrain>=0.5.16         # ECAPA-TDNN speaker embeddings

    # ASR
    - openai-whisper>=20231117

    # Agent / LLM
    - langchain>=0.1.0
    - langchain-community>=0.0.20

    # Vector memory
    - faiss-cpu>=1.7.4
    - sentence-transformers>=2.6.0

    # Language detection
    - langdetect>=1.0.9
    - pycld2>=0.41

    # Web demo (FastAPI backend)
    - fastapi>=0.110.0
    - uvicorn>=0.27.0
    - python-multipart>=0.0.9     # for audio file uploads

    # Dev / testing
    - pytest>=8.0.0
    - black>=24.0.0
    - httpx>=0.27.0               # async test client for FastAPI

# ─── Setup instructions ───────────────────────────────────────────
# conda env create -f environment.yml
# conda activate voiceagent
#
# Verify:
#   python -c "import torch; print(torch.__version__)"
#   python -c "import transformers; print(transformers.__version__)"
#
# To update after adding deps:
#   conda env update -f environment.yml --prune
#
# GPU build (NVIDIA, CUDA 12.1):
#   Replace cpuonly line with:  pytorch-cuda=12.1
#   And change pytorch channel to: pytorch
