name: voiceagent
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - numpy=1.24
  - scipy
  - conda-forge::libsndfile       # required by soundfile on Linux/Mac

  - pip:
    # PyTorch — CPU build (swap cpu for cu121 if you have a GPU)
    - torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
    - torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu

    # Hugging Face stack
    - transformers>=4.38.0
    - datasets>=2.18.0
    - huggingface-hub>=0.21.0
    - accelerate>=0.27.0

    # TTS / Audio
    - soundfile>=0.12.1
    - librosa>=0.10.1
    - speechbrain>=0.5.16

    # ASR
    - openai-whisper>=20231117

    # Agent / LLM
    - langchain>=0.1.0
    - langchain-community>=0.0.20

    # Vector memory
    - faiss-cpu>=1.7.4
    - sentence-transformers>=2.6.0

    # Language detection
    - langdetect>=1.0.9
    - pycld2>=0.41

    # Web demo (FastAPI backend)
    - fastapi>=0.110.0
    - uvicorn>=0.27.0
    - python-multipart>=0.0.9

    # Dev / testing
    - pytest>=8.0.0
    - black>=24.0.0
    - httpx>=0.27.0

# ─── Setup instructions ───────────────────────────────────────────
# conda env create -f environment.yml
# conda activate voiceagent
# pip install -e .                ← run once after creating the env
#
# Verify:
#   python -c "import torch; print(torch.__version__)"   # should print 2.6.0
#
# GPU build (NVIDIA, CUDA 12.1):
#   Replace the torch lines with:
#   - torch==2.6.0 --index-url https://download.pytorch.org/whl/cu121
#   - torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cu121